<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Đố Vui Vô Tri</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14121f; --panel:#1f1c30; --panel2:#2b2742; --ink:#f4f1ff; --muted:#a29cc4;
  --accent:#ffcc33; --hot:#ff4d6d; --ok:#3ddc97;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:'Be Vietnam Pro',system-ui,-apple-system,sans-serif}
body{overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:16px;display:flex;flex-direction:column}
.screen{display:flex;flex-direction:column;gap:14px;flex:1}
.hidden{display:none!important}
h1{margin:6px 0 0;font-size:28px;font-weight:800;letter-spacing:-.5px}
.sub{color:var(--muted);font-size:14px;margin:0}
.row{display:flex;align-items:center;gap:10px}

/* ---------- Board ---------- */
.board{position:relative;width:100%;aspect-ratio:1;border-radius:18px;overflow:hidden;background:#000}
.board .img{image-rendering:pixelated;position:absolute;inset:-15%;background-size:cover;background-position:center;
  filter:blur(var(--blur,60px));transform:translateZ(0);pointer-events:none}
.cells{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
.cell{border:2px solid var(--bg);background:var(--panel2);display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:800;color:var(--muted);cursor:pointer;transition:background .5s}
.cell.open{background:transparent;color:transparent;cursor:default}
.cell.next{color:var(--accent);animation:pulse 1.2s infinite}
.cell.flash{animation:flash 1s}
@keyframes pulse{50%{background:#3a3460}}
@keyframes flash{0%{background:rgba(255,255,255,.75)}100%{background:transparent}}
.cell{position:relative}
.screen-box{background:#000;border-radius:16px;padding:14px;box-shadow:inset 0 0 0 3px #2b2742}
.clues{display:flex;justify-content:center;gap:12px;font-size:44px;margin-top:8px}
.clue{opacity:.35;transition:opacity .4s,transform .4s}
.clue.on{opacity:1;transform:scale(1.1)}
.test-box{display:grid;gap:6px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--panel2)}
.test-box .btn{padding:10px 12px;font-size:14px}
.err-console{position:absolute;inset:auto 10px 10px 10px;background:#000d;border-radius:12px;padding:10px 12px;
  font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.5;color:#9fe7c0;z-index:3}
.err-console .err{color:#ff5c7a;font-weight:700;font-size:15px}
.err-console .dim{color:#a29cc4}
.board.glitch{animation:glitch .25s steps(2) 6}
@keyframes glitch{0%{transform:translate(0)}25%{transform:translate(-6px,2px)}50%{transform:translate(5px,-3px)}75%{transform:translate(-3px,-2px)}100%{transform:translate(0)}}
.boss-reveal{font-size:22px;font-weight:800;text-align:center;line-height:1.4;padding:14px;border-radius:16px;background:var(--panel);color:var(--accent);animation:pop .4s}
.faces{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.face-img{width:100%;aspect-ratio:1;border-radius:14px;background-size:cover;background-position:center}
.face-label{font-weight:700;font-size:13px;margin-top:6px;text-align:center}
.progress{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}

/* ---------- Common UI ---------- */
.btn{border:0;border-radius:14px;padding:14px 16px;font:inherit;font-weight:600;font-size:16px;
  background:var(--panel);color:var(--ink);cursor:pointer;width:100%;text-align:left}
.btn.center{text-align:center}
.btn.primary{background:var(--accent);color:#1a1400;font-weight:800;text-align:center}
.btn:active{transform:scale(.97)}
.btn.right{background:var(--ok);color:#06210f}
.btn.wrong{background:var(--hot)}
.btn:disabled{opacity:.85}
.icon-btn{border:0;background:var(--panel);color:var(--ink);width:42px;height:42px;border-radius:12px;font-size:20px;cursor:pointer}
.game-title{font-size:20px;font-weight:800;flex:1}
.qcount{color:var(--muted);font-size:13px}
.q{font-size:21px;font-weight:700;line-height:1.35}
.opts{display:grid;gap:10px}
.feedback{min-height:24px;font-weight:600;color:var(--accent)}
.big{font-size:56px;text-align:center}
.center-text{text-align:center}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.arena{position:relative;height:380px;background:var(--panel);border-radius:18px;overflow:hidden;touch-action:none}
.hud{display:flex;justify-content:space-between;font-weight:700}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#000c;color:#fff;
  padding:10px 16px;border-radius:12px;font-weight:600;z-index:50;max-width:90%;text-align:center;
  opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}

.odd-grid{display:grid;gap:4px;width:100%;aspect-ratio:1;background:var(--panel);border-radius:16px;padding:6px}
.odd{border:0;background:var(--panel2);border-radius:8px;padding:0;line-height:1;font-size:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.odd.found{background:var(--ok);transform:scale(1.15)}

/* Red button */
.red{width:190px;height:190px;border-radius:50%;border:0;margin:20px auto;display:block;
  background:radial-gradient(circle at 35% 30%,#ff8a9d,#d90429);color:#fff;font:inherit;font-weight:800;font-size:22px;
  box-shadow:0 10px 0 #7a0016,0 18px 30px #0008;transition:transform .3s;cursor:pointer}

.menu{display:flex;flex-direction:column;gap:8px;background:var(--panel);border-radius:16px;padding:12px}
.menu-row{display:flex;align-items:center;gap:10px;font-size:15px}
.menu-emoji{font-size:22px;width:28px;text-align:center;flex:none}
.menu-label{color:var(--muted);width:92px;flex:none}
.menu-dish{font-weight:700}
/* Tug of war */
.tug-ends{display:flex;justify-content:space-between;width:80%;margin:0 auto;font-weight:800;font-size:18px}
.track{position:relative;width:80%;margin:4px auto 0;height:64px;border-radius:32px;background:linear-gradient(90deg,#3ddc9733,var(--panel) 30%,var(--panel) 70%,#ff4d6d33);}
.track::before{content:'';position:absolute;left:8px;right:8px;top:50%;height:6px;margin-top:-3px;background:repeating-linear-gradient(90deg,#c9a46b 0 10px,#a07a45 10px 20px);border-radius:3px}
.mid{position:absolute;left:50%;top:6px;bottom:6px;width:2px;background:var(--muted);opacity:.5}
.knot{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:38px;line-height:1}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo .go{height:150px;font-size:20px}
.go.her{background:#1f4d3a;color:#bff5dc}
.go.him{background:#4d1f2a;color:#ffd0da}
.go.pop{animation:pop .12s}
@keyframes pop{50%{transform:scale(.94)}}
.go{border:0;border-radius:18px;height:96px;width:100%;font:inherit;font-size:24px;font-weight:800;background:var(--panel2);color:var(--ink);cursor:pointer;touch-action:manipulation}


/* Catch game */
.item{position:absolute;top:0;left:0;font-size:34px;line-height:1;will-change:transform}
.basket{position:absolute;bottom:8px;left:0;font-size:46px;line-height:1;will-change:transform}

.chip{position:absolute;top:0;left:0;white-space:nowrap;padding:6px 10px;border-radius:999px;background:#fff;color:#1a1530;font-weight:700;font-size:14px;will-change:transform;box-shadow:0 4px 10px #0006}
.passport{background:var(--panel);border-radius:16px;padding:12px;display:grid;gap:8px}
.pp-title{font-weight:800;font-size:14px;color:var(--muted)}
.pp-chips{display:flex;flex-wrap:wrap;gap:6px}
.pp-chip{background:var(--panel2);border-radius:999px;padding:5px 10px;font-size:13px;font-weight:600}
.stamps{font-size:18px;letter-spacing:2px}
/* Puzzle */
.puz{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:100%;aspect-ratio:1;background:var(--bg);border-radius:14px;overflow:hidden}
.pz{background-size:300% 300%;cursor:pointer;outline:3px solid transparent;outline-offset:-3px}
.pz.sel{outline-color:var(--accent)}
.thumb{width:72px;height:72px;border-radius:10px;background-size:cover;background-position:center;flex:none}

/* Video + final */
.video-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px}
video{width:100%;border-radius:16px;background:#000;max-height:75vh}
.ph-line{font-size:22px;font-weight:700;text-align:center;line-height:1.4;opacity:0;transition:opacity .8s;min-height:120px}
.ph-line.show{opacity:1}
.final{position:relative;flex:1;display:flex;flex-direction:column;gap:18px;justify-content:center}
.final .board .img{inset:0;transform:scale(1.15);transition:filter 3.5s ease,transform 3.5s ease}
.final .board.clear .img{filter:blur(0);transform:scale(1)}
.final-text{font-size:28px;font-weight:800;text-align:center;opacity:0;transition:opacity 1s}
.final-text.show{opacity:1}
.answers{position:relative;height:120px;opacity:0;transition:opacity 1s}
.answers.show{opacity:1}
.answers .btn{position:absolute;width:auto;padding:14px 28px;text-align:center;transition:left .25s,top .25s}
.link-btn{border:0;background:none;color:var(--muted);font:inherit;font-size:14px;padding:10px;cursor:pointer;align-self:center;text-decoration:underline}
.status{font-family:ui-monospace,Menlo,monospace;color:var(--ok);text-align:center;font-size:15px;min-height:20px}
.confetti{position:fixed;top:-40px;font-size:26px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
</style>
</head>
<body>
<div id="app">

  <!-- HOME -->
  <section id="home" class="screen">
    <div>
      <h1 id="homeTitle">Đố Vui Vô Tri 🤪</h1>
      <p class="sub">Thắng mỗi trò để mở 1 mảnh ghép bí ẩn</p>
    </div>
    <div class="board" id="board"><div class="img"></div><div class="cells" id="cells"></div></div>
    <div class="progress"><span id="progText">0/9 mảnh</span><span>Phần thưởng: ???</span></div>
    <button class="btn primary hidden" id="rewardBtn">🔍 Làm rõ ảnh</button>
    <button class="link-btn reset-btn">↺ Chơi lại từ đầu</button>
  </section>

  <!-- GAME -->
  <section id="game" class="screen hidden">
    <div class="row">
      <button class="icon-btn" id="backBtn" aria-label="Quay lại">←</button>
      <div class="game-title" id="gameTitle"></div>
    </div>
    <div id="stage" class="screen"></div>
  </section>

  <!-- VIDEO -->
  <section id="video" class="screen hidden">
    <div class="video-wrap" id="videoWrap"></div>
  </section>

  <!-- FINAL -->
  <section id="final" class="screen hidden">
    <div class="final">
      <div class="board" id="finalBoard"><div class="img"></div></div>
      <div class="final-text" id="finalText"></div>
      <div class="answers" id="answers"></div>
      <div class="status" id="status"></div>
      <button class="link-btn reset-btn">↺ Chơi lại từ đầu</button>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>

      <text x='${x+100}' y='${y+125}' font-size='80' font-weight='bold' text-anchor='middle' fill='#fff' font-family='sans-serif'>${i+1}</text>`;

/* =====================================================================
   Tiện ích
   ===================================================================== */
const $ = s => document.querySelector(s);
function h(tag, props = {}, ...kids){
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)){
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat()){ if (c == null) continue; e.append(c.nodeType ? c : document.createTextNode(c)); }
  return e;
}
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const pick = a => a[Math.floor(Math.random() * a.length)];
let toastTimer;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), CONFIG.toastDuration); }
function showScreen(id){ document.querySelectorAll('.screen').forEach(s => { if (s.parentElement.id === 'app') s.classList.toggle('hidden', s.id !== id); }); window.scrollTo(0, 0); }
function tracker(){
  const t = [], iv = []; let rafId = null, alive = true;
  return {
    to(f, ms){ const id = setTimeout(() => alive && f(), ms); t.push(id); return id; },
    iv(f, ms){ const id = setInterval(() => alive && f(), ms); iv.push(id); return id; },
    raf(f){ rafId = requestAnimationFrame(ts => alive && f(ts)); },
    get alive(){ return alive; },
    clear(){ alive = false; t.forEach(clearTimeout); iv.forEach(clearInterval); if (rafId) cancelAnimationFrame(rafId); }
  };
}
const ROASTS = ["Sai nhưng tự tin, anh quý điều đó 😌", "Câu này dễ mà 😒", "Không sao, IQ không phải tất cả", "Gần đúng... nếu nhìn từ sao Hỏa"];
function winPanel(stage, title, note, label, win){
  stage.innerHTML = '';
  stage.append(
    h('div', { class: 'big' }, '🎉'),
    h('div', { class: 'q center-text' }, title),
    note ? h('p', { class: 'sub center-text' }, note) : null,
    h('button', { class: 'btn primary', onclick: win }, label || 'Mở mảnh ghép 🧩')
  );
}
function tripleTap(el, fn){
  let n = 0, last = 0;
  el.addEventListener('click', () => { const now = Date.now(); n = now - last < 500 ? n + 1 : 1; last = now; if (n >= 3){ n = 0; fn(); } });
}

// 1. Đố vui vô tri
function gQuizVoTri(stage, win, T){
  const qs = CONFIG.quizVoTri; let i = 0, score = 0;
  function render(){
    const q = qs[i]; stage.innerHTML = '';
    const fb = h('div', { class: 'feedback' });
    const btns = q.options.map((o, k) => h('button', { class: 'btn', onclick: () => choose(k) }, o));
    stage.append(h('div', { class: 'qcount' }, `Câu ${i + 1}/${qs.length}`), h('div', { class: 'q' }, q.q), h('div', { class: 'opts' }, btns), fb);
    function choose(k){
      btns.forEach(b => b.disabled = true);
      if (k === q.answer){ score++; btns[k].classList.add('right'); fb.textContent = 'Chuẩn! 🎯'; }
      else { btns[k].classList.add('wrong'); btns[q.answer].classList.add('right'); fb.textContent = pick(ROASTS); }
      T.to(() => { i++; i < qs.length ? render() : winPanel(stage, `Điểm: ${score}/${qs.length}`, 'Đủ điều kiện qua màn (tiêu chuẩn thấp lắm).', null, win); }, CONFIG.feedbackDelay);
    }
  }
  render();
}

// 2. Tìm emoji lạc loài
function gOddOne(stage, win, T){
  const PAIRS = CONFIG.oddPairs, SIZES = CONFIG.oddSizes, TIME = CONFIG.oddTime;
  const HIT = ['Mắt diều hâu 🦅', 'Ghê thật 👀', 'Thấy rồi! 🎯', 'Không thoát được em đâu 😎'];
  const MISS = ['Nhìn kỹ lại đi 🤓', 'Cái đó giống hệt mà 😆', 'Hoa mắt rồi à?', 'Trừ 2 giây nhé ⏱'];
  let r = 0;
  function round(){
    stage.innerHTML = '';
    const n = SIZES[r], [same, odd] = PAIRS[r % PAIRS.length], oddAt = Math.floor(Math.random() * n * n);
    let left = TIME, over = false;
    const hud = h('div', { class: 'hud' }, h('span', {}, `Vòng ${r + 1}/${SIZES.length}`), h('span', {}, `⏱ ${left}s`));
    const fb = h('div', { class: 'feedback center-text' }, 'Tìm cái khác biệt!');
    const grid = h('div', { class: 'odd-grid', style: `grid-template-columns:repeat(${n},1fr);font-size:${Math.max(18, 140 / n)}px` });
    for (let k = 0; k < n * n; k++){
      const c = h('button', { class: 'odd' }, k === oddAt ? odd : same);
      c.addEventListener('pointerdown', e => {
        e.preventDefault(); if (over) return;
        if (k === oddAt){
          over = true; c.classList.add('found'); fb.textContent = pick(HIT);
          T.to(() => { r++; r < SIZES.length ? round() : winPanel(stage, 'Mắt thần! 👁️', 'Không emoji nào trốn được.', null, win); }, CONFIG.feedbackDelay * 0.6);
        } else {
          left = Math.max(0, left - 2); hud.children[1].textContent = `⏱ ${left}s`;
          c.classList.add('shake'); fb.textContent = pick(MISS); T.to(() => c.classList.remove('shake'), 400);
        }
      });
      grid.append(c);
    }
    stage.append(hud, grid, fb);
    const tick = T.iv(() => {
      if (over) return clearInterval(tick);
      left--; hud.children[1].textContent = `⏱ ${left}s`;
      if (left <= 0){
        over = true; clearInterval(tick); grid.children[oddAt].classList.add('found');
        fb.textContent = 'Hết giờ! Nó trốn ở đây này 😜';
        T.to(round, CONFIG.feedbackDelay);
      }
    }, 1000);
  }
  round();
}

// Lấy emoji đầu tiên của một cụm (giữ nguyên emoji ghép như 👨‍🍳)
function firstEmoji(str){
  try { return [...new Intl.Segmenter().segment(str)][0].segment; } catch (e) { return Array.from(str)[0]; }
}
// Đoán phim — emoji gợi ý hiện dần (mỗi phần tử trong clues là 1 lượt hiện, có thể gồm nhiều emoji)
function gMovie(stage, win, T){
  const qs = CONFIG.movies; let i = 0, pop = 0;
  function render(){
    const q = qs[i]; stage.innerHTML = '';
    let shown = 1, solved = false;
    const clueBox = h('div', { class: 'clues' }, q.clues.map((c, k) => h('span', { class: 'clue' + (k < shown ? ' on' : '') }, k < shown ? c : '❔')));
    const fb = h('div', { class: 'feedback' }), hintEl = h('p', { class: 'sub' });
    const hud = h('div', { class: 'hud' }, h('span', {}, `Phim ${i + 1}/${qs.length}`), h('span', {}, `🍿 ${pop}`));
    const btns = q.options.map((o, k) => h('button', { class: 'btn', onclick: () => choose(k) }, `${'ABCD'[k]}. ${o}`));
    stage.append(hud, h('div', { class: 'screen-box' }, h('div', { class: 'sub center-text' }, '🎬 Phim gì đây?'), clueBox), h('div', { class: 'opts' }, btns), fb, hintEl);
    const tick = T.iv(() => {
      if (solved || shown >= q.clues.length) return clearInterval(tick);
      const el = clueBox.children[shown]; el.textContent = q.clues[shown]; el.classList.add('on'); shown++;
    }, CONFIG.movieClueMs);
    function choose(k){
      if (solved) return;
      if (k === q.answer){
        solved = true; clearInterval(tick);
        const gain = q.clues.length - shown + 1; pop += gain;
        q.clues.forEach((c, n) => { clueBox.children[n].textContent = c; clueBox.children[n].classList.add('on'); });
        btns[k].classList.add('right'); btns.forEach(b => b.disabled = true); hintEl.textContent = '';
        hud.children[1].textContent = `🍿 ${pop}`;
        fb.textContent = gain >= q.clues.length ? `Mới 1 gợi ý đã đoán ra! +${gain} 🍿` : `Chuẩn! +${gain} 🍿`;
        T.to(() => { i++; i < qs.length ? render() : done(); }, CONFIG.feedbackDelay * 0.8);
      } else {
        btns[k].classList.add('shake'); T.to(() => btns[k].classList.remove('shake'), 400);
        fb.textContent = q.wrong || pick(ROASTS); hintEl.textContent = q.hint ? `Gợi ý: ${q.hint}` : '';
      }
    }
  }
  function done(){
    stage.innerHTML = '';
    stage.append(
      h('div', { class: 'big' }, '🎟️'),
      h('div', { class: 'q center-text' }, CONFIG.movieDoneTitle),
      h('p', { class: 'sub center-text' }, `Tổng: ${pop} 🍿`),
      h('div', { class: 'menu' }, qs.map(q => h('div', { class: 'menu-row' },
        h('span', { class: 'menu-emoji' }, firstEmoji(q.clues[0])), h('span', { class: 'menu-dish' }, q.options[q.answer])))),
      h('p', { class: 'q center-text', style: 'font-size:18px' }, CONFIG.movieDoneNote),
      h('button', { class: 'btn primary', onclick: win }, 'Mở mảnh ghép 🧩'));
  }
  render();
}

// 5. Kéo co — 2 người chơi trên cùng 1 điện thoại (hoặc đấu với máy nếu tugMode = "bot")
function gKeoCo(stage, win, T){
  const TAP = CONFIG.tugTapPower, BOT = CONFIG.tugBotPower, DUO = CONFIG.tugMode !== 'bot', L = CONFIG.tugLength;
  const HER = CONFIG.herName, HIM = CONFIG.hisName;
  function intro(){
    stage.innerHTML = '';
    stage.append(h('div', { class: 'big' }, '🪢'),
      h('div', { class: 'q center-text' }, DUO ? `${HER} vs ${HIM}` : `Kéo co với ${HIM}`),
      h('p', { class: 'sub center-text' }, DUO
        ? `Hai người cầm chung điện thoại. ${HER} bấm nút bên trái, ${HIM} bấm nút bên phải. Ai bấm nhanh hơn kéo được nút dây về phía mình là thắng!`
        : 'Bấm liên tục thật nhanh để kéo nút dây về phía mình.'),
      h('button', { class: 'btn primary', onclick: play }, 'Vào trận!'));
  }
  function play(){
    stage.innerHTML = '';
    let pos = 0, over = false, started = false, last = 0, boostUntil = 0, boostUsed = false, talkAt = 0;
    let mode = 'normal', modeUntil = 0, burstUsed = false, herTaps = 0, himTaps = 0;
    const knot = h('div', { class: 'knot' }, '🎀');
    const track = h('div', { class: 'track' }, h('div', { class: 'mid' }), knot);
    const talk = h('div', { class: 'feedback center-text' }, 'Chuẩn bị...');
    const say = t => { talk.textContent = t; };
    const btnHer = h('button', { class: 'go her' }, `💪 ${HER} KÉO`);
    const btnHim = h('button', { class: 'go him' }, `${HIM} KÉO 😈`);
    stage.append(h('div', { class: 'tug-ends' }, h('span', {}, `🙋‍♀️ ${HER}`), h('span', {}, `${HIM} 😈`)), track, talk,
      DUO ? h('div', { class: 'duo' }, btnHer, btnHim) : btnHer);
    const bump = b => { b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); };
    btnHer.addEventListener('pointerdown', e => {
      e.preventDefault(); if (!started || over) return;
      pos -= TAP * (performance.now() < boostUntil ? 2 : 1); herTaps++; bump(btnHer);
    });
    btnHim.addEventListener('pointerdown', e => {
      e.preventDefault(); if (!started || over) return;
      pos += TAP; himTaps++; bump(btnHim);
    });
    // Đếm ngược 3-2-1
    let c = 3; say('3');
    T.iv(() => { if (started) return; c--; if (c > 0) say(String(c)); else { say('KÉO!!! 🔥'); started = true; last = performance.now(); T.raf(frame); } }, 800);

    function frame(now){
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (DUO){
        // "Trọng tài" thiên vị: khi Em bị kéo về phía Anh, cho Em nhân đôi lực 3 giây (1 lần)
        if (!boostUsed && pos > L * 0.4){ boostUsed = true; boostUntil = now + 3000; say(`⚡ Trọng tài thiên vị: ${HER} x2 sức kéo trong 3 giây!`); talkAt = now + 3200; }
        if (now > talkAt){
          talkAt = now + 2200;
          if (pos > L * 0.3) say(pick([`${HIM} đang thắng thế, ${HER} cố lên!`, `${HER} đang bị kéo kìa 😱`, 'Bấm nhanh nữa lên!']));
          else if (pos < -L * 0.3) say(pick([`${HIM} yếu thế 😆`, `${HER} khỏe ghê, ăn Kichi có khác`, `${HIM} sắp thua rồi!`]));
          else say(pick(['Ngang tài ngang sức! 🔥', 'Chưa ai chịu ai', 'Căng như dây đàn']));
        }
      } else {
        if (mode === 'burst' && now > modeUntil){ mode = 'cramp'; modeUntil = now + 2200; say('Á á... chuột rút rồi 🦵😭'); }
        else if (mode === 'cramp' && now > modeUntil){ mode = 'normal'; say('Anh hồi sức rồi nhé 😤'); }
        if (mode === 'normal' && pos < -L * 0.55 && !burstUsed){ burstUsed = true; mode = 'burst'; modeUntil = now + 1300; say('ANH DỒN HẾT SỨC ĐÂY!!! 🔥'); }
        if (mode === 'normal' && pos > L * 0.55){ mode = 'mercy'; modeUntil = now + 1800; say('Thôi anh nhường tí, cố lên 😌'); }
        if (mode === 'mercy' && now > modeUntil) mode = 'normal';
        pos += (mode === 'burst' ? BOT * 2.6 : mode === 'cramp' ? 0 : mode === 'mercy' ? BOT * 0.2 : BOT) * dt;
        if (mode === 'normal' && now > talkAt){ talkAt = now + 2500; say(pos > L * 0.15 ? pick(['Sắp thắng rồi nhé 😏', 'Bấm nhanh nữa lên!']) : pos < -L * 0.15 ? pick(['Ơ khỏe thế 😳', 'Từ từ đã nào!']) : pick(['Kéo nổi anh không đấy? 😏', 'Tay yếu thế 😆'])); }
      }
      pos = Math.max(-L, Math.min(L, pos));
      knot.style.left = `${50 + (pos / L) * 42}%`;
      if (pos <= -L){ over = true; say(''); T.to(() => winPanel(stage, `${HER} thắng! 🏆`, `${HIM} tâm phục khẩu phục.`, null, win), 500); return; }
      if (pos >= L){
        over = true; say('');
        if (DUO) T.to(() => winPanel(stage, `${HIM} thắng...? 🤔`, `Nhưng trọng tài xử ${HER} thắng vì đáng yêu hơn 😌`, null, win), 500);
        else { stage.innerHTML = ''; stage.append(h('div', { class: 'big' }, '😈🪢'), h('div', { class: 'q center-text' }, `${HIM} thắng rồi, hehe.`), h('button', { class: 'btn primary', onclick: play }, 'Phục thù')); }
        return;
      }
      T.raf(frame);
    }
  }
  intro();
}

// 6. Xếp vali — hứng nơi muốn đi; nơi đã đi thì đóng dấu kỷ niệm, không tính điểm
function gCatch(stage, win, T){
  const WISH = CONFIG.placesWish, BEEN = CONFIG.placesBeen, BADS = CONFIG.placesNot;
  function intro(){
    stage.innerHTML = '';
    stage.append(h('div', { class: 'big' }, '🧳✈️'),
      h('div', { class: 'q center-text' }, CONFIG.catchIntro),
      h('p', { class: 'sub center-text' }, CONFIG.catchRule),
      h('p', { class: 'sub center-text' }, 'Kéo ngón tay qua lại để di chuyển vali.'),
      h('button', { class: 'btn primary', onclick: play }, 'Lên đường'));
  }
  function play(){
    stage.innerHTML = '';
    let got = [], stamped = [], over = false, items = [], last = performance.now(), spawnAcc = 0;
    const hud = h('div', { class: 'hud' }, h('span', {}, `✈️ 0/${WISH.length}`), h('span', { class: 'stamps' }, ''));
    const arena = h('div', { class: 'arena' });
    const basket = h('div', { class: 'basket' }, '🧳');
    arena.append(basket); stage.append(hud, arena);
    const W = () => arena.clientWidth, H = () => arena.clientHeight;
    let bx = W() / 2;
    const moveTo = e => { const r = arena.getBoundingClientRect(); bx = Math.max(30, Math.min(W() - 30, e.clientX - r.left)); };
    arena.addEventListener('pointerdown', moveTo); arena.addEventListener('pointermove', moveTo);
    const drawHud = () => { hud.children[0].textContent = `✈️ ${got.length}/${WISH.length}`; hud.children[1].textContent = got.map(p => p.emoji).join(''); };
    function spawn(){
      const left = WISH.filter(p => !got.includes(p)), r = Math.random();
      let kind = r < 0.45 ? 'wish' : r < 0.8 ? 'been' : 'bad';
      if (kind === 'wish' && !left.length) kind = 'been';
      const data = kind === 'wish' ? pick(left) : kind === 'been' ? pick(BEEN) : pick(BADS);
      const el = h('div', { class: 'chip ' + kind }, `${data.emoji} ${data.name}`);
      arena.append(el);
      const half = Math.min(W() / 2 - 4, el.offsetWidth / 2);
      items.push({ el, kind, data, half, x: half + Math.random() * (W() - half * 2), y: -40, v: 95 + Math.random() * 55 + got.length * 6 });
    }
    function frame(now){
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      spawnAcc += dt;
      if (spawnAcc > 0.85){ spawnAcc = 0; spawn(); }
      basket.style.transform = `translateX(${bx - 26}px)`;
      const catchY = H() - 70;
      items = items.filter(it => {
        it.y += it.v * dt;
        it.el.style.transform = `translate(${it.x - it.half}px, ${it.y}px)`;
        if (it.y > catchY && it.y < catchY + 34 && Math.abs(it.x - bx) < it.half + 18){
          it.el.remove();
          if (it.kind === 'bad'){ const lost = got.pop(); toast(it.data.msg || CONFIG.catchBadText + (lost ? ` (mất ${lost.name})` : '')); }
          else if (it.kind === 'been'){ if (!stamped.includes(it.data)) stamped.push(it.data); toast(`${it.data.emoji} ${it.data.name}: ${pick(CONFIG.beenMsgs)}`); }
          else if (!got.includes(it.data)){ got.push(it.data); toast(`✈️ ${it.data.name} vào vali!`); }
          drawHud();
          return false;
        }
        if (it.y > H()){ it.el.remove(); return false; }
        return true;
      });
      if (got.length >= WISH.length){ over = true; T.to(done, 400); return; }
      if (!over) T.raf(frame);
    }
    T.raf(frame);
  }
  function done(){
    stage.innerHTML = '';
    const chips = list => h('div', { class: 'pp-chips' }, list.map(p => h('span', { class: 'pp-chip' }, `${p.emoji} ${p.name}`)));
    stage.append(
      h('div', { class: 'big' }, '🛂'),
      h('div', { class: 'q center-text' }, CONFIG.catchDoneTitle),
      h('div', { class: 'passport' },
        h('div', { class: 'pp-title' }, `✅ Đã đóng dấu (${BEEN.length})`), chips(BEEN),
        h('div', { class: 'pp-title' }, `✈️ Chuyến tiếp theo (${WISH.length})`), chips(WISH)),
      h('p', { class: 'q center-text', style: 'font-size:18px' }, CONFIG.catchDoneNote),
      h('button', { class: 'btn primary', onclick: win }, 'Mở mảnh ghép 🧩'));
  }
  intro();
}

// 8. Ghép ảnh (chạm 2 ô để đổi chỗ)
function gPuzzle(stage, win, T){
  let order, solved = false;
  do { order = shuffle([0,1,2,3,4,5,6,7,8]); } while (order.every((v, i) => v === i));
  let sel = null;
  const grid = h('div', { class: 'puz' });
  // Giữ đúng tỉ lệ ảnh (ảnh ngang thì khung ngang)
  let ratio = '16 / 9';
  const probe = new Image();
  probe.onload = () => { ratio = `${probe.naturalWidth} / ${probe.naturalHeight}`; grid.style.aspectRatio = ratio; };
  probe.src = (COUPLE_BG.match(/url\(["']?(.*?)["']?\)$/) || [])[1] || '';
  stage.append(h('p', { class: 'sub' }, 'Chạm 2 ô để đổi chỗ cho nhau. Ghép lại thành bức ảnh hoàn chỉnh.'), grid);
  function draw(){
    grid.innerHTML = '';
    order.forEach((v, idx) => {
      const t = h('div', { class: 'pz' + (sel === idx ? ' sel' : '') });
      t.style.backgroundImage = COUPLE_BG;
      t.style.backgroundPosition = `${(v % 3) * 50}% ${Math.floor(v / 3) * 50}%`;
      t.addEventListener('click', () => {
        if (solved) return;
        if (sel === null){ sel = idx; }
        else if (sel === idx){ sel = null; }
        else { [order[sel], order[idx]] = [order[idx], order[sel]]; sel = null; }
        draw();
        if (order.every((v, i) => v === i)){ solved = true; T.to(() => winPanel(stage, CONFIG.puzzleDoneTitle, CONFIG.puzzleDoneNote, null, win), 600); }
      });
      grid.append(t);
    });
  }
  draw();
}

function gBoss(stage, win, T){

  const bg = (p, n) => p.img ? `url("${p.img}")` : bossPlaceholder(p.temp || '👤', [330, 210, 40][n % 3]);

      if (p.pos) im.style.backgroundPosition = `${p.pos}, center`;

    const btns = q.options.map((o, k) => h('button', { class: 'btn', onclick: () => choose(k) }, `${'ABCD'[k]}. ${o}`));
    stage.append(h('div', { class: 'qcount' }, `BOSS CUỐI 👑 · Câu ${i + 1}/${qs.length}`), faces, h('div', { class: 'q' }, q.q), h('div', { class: 'opts' }, btns), fb);
    let done = false;
    const tried = new Set();
    function choose(k){
      if (done) return;
      if (k !== q.answer){
        btns[k].classList.add('shake', 'wrong'); T.to(() => btns[k].classList.remove('shake'), 400);
        fb.textContent = (q.wrong && q.wrong[k]) || pick(ROASTS);
        tried.add(k);
        if (q.answer === 'none' && tried.size === q.options.length){
          done = true; btns.forEach(b => b.disabled = true);
          T.to(() => {
            fb.textContent = '';
            stage.append(h('div', { class: 'boss-reveal' }, q.reveal));
            T.to(() => { i++; i < qs.length ? render() : winPanel(stage, 'Hạ gục boss!', 'Mảnh ghép cuối cùng đã mở.', 'Mở mảnh cuối 🧩', win); }, CONFIG.feedbackDelay * 1.8);
          }, CONFIG.feedbackDelay * 0.6);
        }
        return;
      }
      done = true; btns[k].classList.add('right'); btns.forEach(b => b.disabled = true);
      fb.textContent = q.praise || 'Chuẩn! 🎯';
      T.to(() => { i++; i < qs.length ? render() : winPanel(stage, 'Hạ gục boss!', 'Mảnh ghép cuối cùng đã mở.', 'Mở mảnh cuối 🧩', win); }, CONFIG.feedbackDelay);
    }
  }
  render();
}

/* =====================================================================
   Luồng chính
   ===================================================================== */
// Thứ tự trò chơi: trò vui, không liên quan trước → dần dần về hai người → boss cuối (ô giữa)
const GAME_LIST = {
  voTri:   ['Đố vui vô tri', gQuizVoTri],
  oddOne:  ['Tìm emoji lạc loài', gOddOne],
  nutDo:   ['Đừng bấm nút đỏ', gNutDo],
  keoCo:   ['Kéo co', gKeoCo],
  food:    ['Đố vui ẩm thực', gFood],
  movie:   ['Phim gì đây?', gMovie],
  vali:    ['Xếp vali', gCatch],
  memory:  ['Ai nhớ hơn?', gMemories],
  puzzle:  ['Hợp thể!', gPuzzle],
};
const SEQ = CONFIG.gameOrder.filter(k => GAME_LIST[k]).slice(0, 8);
const BOSS = ['Boss cuối', gBoss];
const CENTER = 4;
const KEY = 'dvvt_progress_v2';
const params = new URLSearchParams(location.search);
let opened = (() => {
  try {
    if (params.has('reset')) localStorage.removeItem(KEY);
    return JSON.parse(localStorage.getItem(KEY) || '[]');
  } catch (e) { return []; }
})();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(opened)); } catch (e) {} };
const outerDone = () => opened.filter(i => i !== CENTER).length;
// Trò tiếp theo luôn theo thứ tự, bất kể bấm ô nào
const nextGame = () => outerDone() < 8 ? GAME_LIST[SEQ[outerDone()]] : BOSS;
const isPlayable = i => !opened.includes(i) && (i !== CENTER || outerDone() >= 8);
let current = null, T = null, justOpened = null;

document.querySelectorAll('.board').forEach(b => b.style.setProperty('--blur', CONFIG.blurPx + 'px'));
$('#board .img').style.backgroundImage = RING_BG;
$('#finalBoard .img').style.backgroundImage = RING_BG;

function renderHome(){
  const cells = $('#cells'); cells.innerHTML = '';
  for (let i = 0; i < 9; i++){
    const isOpen = opened.includes(i), ok = isPlayable(i);
    const c = h('div', { class: 'cell' + (isOpen ? ' open' : '') + (ok ? ' next' : '') + (i === justOpened ? ' flash' : '') },
      isOpen ? '' : (ok ? (i === CENTER ? '👑' : '?') : '🔒'));
    c.addEventListener('click', () => {
      if (isOpen) return;
      if (ok) startGame(i);
      else toast('Ô giữa là trùm cuối, mở hết các ô xung quanh trước nha 😏');
    });
    cells.append(c);
  }
  justOpened = null;
  document.querySelectorAll('#board .err-console').forEach(e => e.remove());
  $('#board .img').style.filter = ''; $('#rewardBtn').disabled = false;
  $('#progText').textContent = `${opened.length}/9 mảnh`;
  $('#rewardBtn').classList.toggle('hidden', opened.length < 9);
  showScreen('home');
}

// cell = ô được bấm (sẽ lộ phần ảnh của ô đó), game = [tên, hàm]; cell = null là chơi thử không tính tiến độ
function startGame(cell, game){
  game = game || nextGame();
  current = cell; T = tracker();
  $('#gameTitle').textContent = game[0];
  const stage = $('#stage'); stage.innerHTML = '';
  showScreen('game');
  let done = false;
  game[1](stage, () => { if (done) return; done = true; finishGame(cell); }, T);
}
function finishGame(cell){
  T && T.clear();
  if (cell !== null && !opened.includes(cell)){ opened.push(cell); save(); justOpened = cell; }
  current = null;
  renderHome();
}
$('#backBtn').addEventListener('click', () => { T && T.clear(); current = null; renderHome(); });

// Phím tắt bí mật: chạm 3 lần vào tiêu đề game = thắng luôn màn đó
tripleTap($('#gameTitle'), () => { if (T && T.alive){ toast('⏭ Bỏ qua'); finishGame(current); } });
// Chạm 3 lần vào tiêu đề trang chủ = mở 1 ô (để test nhanh)
tripleTap($('#homeTitle'), () => {
  const i = [0,1,2,3,5,6,7,8,4].find(isPlayable);
  if (i !== undefined){ opened.push(i); save(); justOpened = i; renderHome(); }
});

/* ---------- Clip ---------- */
$('#rewardBtn').addEventListener('click', enhanceFail);
// Đủ 9 ô: bấm "Làm rõ ảnh" → thử làm rõ thất bại → báo lỗi → chuyển sang clip
function enhanceFail(){
  const btn = $('#rewardBtn'); if (btn.disabled) return; btn.disabled = true;
  const board = $('#board'), img = $('#board .img');
  const con = h('div', { class: 'err-console' }); board.append(con);
  const line = (t, cls) => { const l = h('div', { class: cls || '' }, t); con.append(l); return l; };
  img.style.transition = 'filter 1.6s ease';
  img.style.filter = `blur(${Math.round(CONFIG.blurPx * 0.55)}px)`;
  line('> enhance --image phan_thuong.png');
  const bar = line('> đang làm rõ... ░░░░░░░░░░ 0%');
  let k = 0;
  const iv = setInterval(() => {
    k++; const pct = Math.min(87, k * 11);
    bar.textContent = `> đang làm rõ... ${'█'.repeat(Math.round(pct / 10))}${'░'.repeat(10 - Math.round(pct / 10))} ${pct}%`;
    if (pct >= 87){
      clearInterval(iv);
      setTimeout(() => {
        img.style.transition = 'filter .15s'; img.style.filter = '';
        board.classList.add('glitch');
        line('status_error: unclear, not engaged', 'err');
        setTimeout(() => line('> thiếu 1 bước xác nhận cuối cùng...', 'dim'), 1200);
        setTimeout(() => { board.classList.remove('glitch'); playClip(); }, CONFIG.errorHoldMs);
      }, 500);
    }
  }, 220);
}
function playClip(){
  const wrap = $('#videoWrap'); wrap.innerHTML = '';
  showScreen('video');
  if (CONFIG.videoSrc){
    const v = h('video', { src: CONFIG.videoSrc, playsinline: '', 'webkit-playsinline': '', preload: 'auto' });
    const playBtn = h('button', { class: 'btn primary hidden' }, '▶ Bấm để xem');
    wrap.append(v, playBtn);
    v.addEventListener('ended', reveal);
    playBtn.addEventListener('click', () => { playBtn.classList.add('hidden'); v.play(); });
    v.play().catch(() => playBtn.classList.remove('hidden'));
    tripleTap(v, () => { v.pause(); reveal(); });
  } else {
    const line = h('div', { class: 'ph-line' });
    wrap.append(line);
    const lines = CONFIG.placeholderLines; let k = 0;
    (function next(){
      if (k >= lines.length){ setTimeout(reveal, 600); return; }
      line.classList.remove('show');
      setTimeout(() => { line.textContent = lines[k++]; line.classList.add('show'); setTimeout(next, CONFIG.clipLineDuration); }, 500);
    })();
  }
}

/* ---------- Lộ ảnh ---------- */
let revealed = false;
function reveal(){
  if (revealed) return; revealed = true;
  showScreen('final');
  setTimeout(() => revealed && $('#finalBoard').classList.add('clear'), 400);
  setTimeout(() => {
    if (!revealed) return;
    $('#finalText').textContent = CONFIG.finalText;
    $('#finalText').classList.add('show');
    if (CONFIG.showYesNo) setupAnswers();
  }, 4200);
}
function setupAnswers(){
  const box = $('#answers'); box.innerHTML = ''; box.classList.add('show');
  const yes = h('button', { class: 'btn primary', style: 'left:12%;top:30px' }, 'YES 💖');
  const no = h('button', { class: 'btn', style: 'right:12%;top:30px' }, 'Không');
  const NO_TEXT = ['Chắc chưa?', 'Nghĩ lại đi', 'Bấm nhầm à?', 'Không bấm được đâu', '😏'];
  let n = 0;
  const flee = e => {
    e.preventDefault();
    no.style.right = 'auto';
    no.style.left = (Math.random() * Math.max(0, box.clientWidth - no.offsetWidth)) + 'px';
    no.style.top = (Math.random() * Math.max(0, box.clientHeight - no.offsetHeight)) + 'px';
    no.textContent = NO_TEXT[n++ % NO_TEXT.length];
  };
  no.addEventListener('pointerdown', flee);
  no.addEventListener('pointerenter', flee);
  no.addEventListener('click', flee);
  yes.addEventListener('click', () => {
    box.classList.remove('show');
    $('#status').textContent = 'relationship_status = "engaged" ✅';
    confetti();
  });
  box.append(yes, no);
}
function confetti(){
  const set = ['💍', '🎉', '💖', '✨', '✈️'];
  for (let i = 0; i < 70; i++){
    const s = h('span', { class: 'confetti' }, pick(set));
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = (2.5 + Math.random() * 3) + 's';
    s.style.animationDelay = (Math.random() * 1.5) + 's';
    document.body.append(s);
    setTimeout(() => s.remove(), 7500);
  }
}

/* ---------- Reset ---------- */
let resetArmed = null;
function onResetClick(e){
  const b = e.currentTarget;
  if (resetArmed !== b){
    resetArmed = b; b.textContent = 'Chạm lần nữa để xác nhận chơi lại';
    clearTimeout(b._t); b._t = setTimeout(() => { if (resetArmed === b) resetArmed = null; b.textContent = '↺ Chơi lại từ đầu'; }, 3000);
    return;
  }
  resetArmed = null; clearTimeout(b._t);
  document.querySelectorAll('.reset-btn').forEach(x => x.textContent = '↺ Chơi lại từ đầu');
  resetGame();
}
function resetGame(){
  T && T.clear(); current = null; justOpened = null; revealed = false;
  opened = []; try { localStorage.removeItem(KEY); } catch (e) {}
  const v = document.querySelector('#videoWrap video'); if (v) v.pause();
  $('#videoWrap').innerHTML = '';
  $('#finalBoard').classList.remove('clear');
  $('#finalText').classList.remove('show'); $('#finalText').textContent = '';
  $('#answers').classList.remove('show'); $('#answers').innerHTML = '';
  $('#status').textContent = '';
  renderHome();
  toast('Đã reset, chơi lại thôi!');
}
document.querySelectorAll('.reset-btn').forEach(b => b.addEventListener('click', onResetClick));

document.addEventListener('contextmenu', e => e.preventDefault());
renderHome();
</script>
